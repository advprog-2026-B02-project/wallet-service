name: Wallet Service CI/CD

env:
  DOCKERHUB_USERNAME: mugmold
  DOCKER_IMAGE: bidmart-wallet-service

on:
  push:
    branches: [ master, main, staging ]
  pull_request:
    branches: [ master, main, staging ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    container:
      image: gradle:8.12.1-jdk21

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test
        run: gradle --no-daemon test jacocoTestReport
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: test-256-bit-secret-key-change-in-production
          INTERNAL_SERVICE_TOKEN: test-service-token

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-test-results
          path: build/reports/tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-coverage-report
          path: build/reports/jacoco/

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        if: github.ref != 'refs/heads/staging'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest

      - name: Build and push staging image
        if: github.ref == 'refs/heads/staging'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:staging
