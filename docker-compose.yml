services:
  wallet-db:
    image: postgres:16-alpine
    container_name: bidmart-wallet-db
    environment:
      POSTGRES_DB: bidmart_wallet
      POSTGRES_USER: ${WALLET_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${WALLET_DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - wallet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: wallet-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: wallet-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  wallet-service:
    build: .
    image: mugmold/bidmart-wallet-service:latest
    container_name: bidmart-wallet-app
    depends_on:
      wallet-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVER_PORT: 8084
      WALLET_DB_URL: jdbc:postgresql://wallet-db:5432/bidmart_wallet
      WALLET_DB_USERNAME: ${WALLET_DB_USERNAME:-postgres}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8084:8084"

volumes:
  wallet-db-data:
